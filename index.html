<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adapt.css">
    <title>Pictures</title>
</head>
<body>

        <h1 class="caption">Картинки</h1>

            <div class="item">
                <img class="item_img" src="flower.png" alt="Плакат">

            <div class="item">
                <img class="item_img" src="pin.jpg" alt="Пингвины">

            </div>
        </div>
    </div>
</body>
</html>
